<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>e-SHE Platform Notifications</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #16325c;
}

body {
    padding: 20px;
}

/* Header */

.header {
    font-size: 22px;
    font-weight: bold;
    color: #0176d3;
    margin-bottom: 6px;
}

.subheader {
    font-size: 14px;
    color: #555;
    margin-bottom: 18px;
}

/* Banner */

.banner {
    display: inline-block;
    text-decoration: none;
}

.banner img {
    width: 300px;
    height: auto;
    display: block;
    border: 1px solid #d8dde6;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: transform .15s ease;
}

.banner:hover img {
    transform: scale(1.01);
}

/* Status Section */

.status {
    margin-top: 22px;
    width: 300px;
    border-top: 1px solid #d8dde6;
    padding-top: 16px;
}

.status-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #16325c;
}

.status-text {
    font-size: 14px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 14px;
}

.status-link {
    display: inline-block;
    background: #0176d3;
    color: white !important;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-weight: bold;
}

.status-link:hover {
    background: #005fb2;
}

</style>

</head>

<body>

<div class="header">
    e-SHE Platform Notifications
</div>

<div class="subheader">
    Scheduled maintenance and important platform announcements.
</div>

<a class="banner"
   href="https://system-health.eshe-systems.org/"
   target="_blank"
   rel="noopener noreferrer">

    <!-- Change only this filename each month -->

    <img src="Alert_Banner_sept24.png"
         alt="e-SHE Maintenance Alert">

</a>

<div class="status">

    <div class="status-title">
        Current System Status
    </div>

    <div class="status-text">
        Check the current availability of all e-SHE services.
    </div>

    <a class="status-link"
       href="https://system-health.eshe-systems.org/"
       target="_blank"
       rel="noopener noreferrer">
        View System Health →
    </a>

</div>

</body>
</html>
